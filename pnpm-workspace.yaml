packages:
  - "packages/**"
  - "!**/lib/**"
  - "!**/esm/**"
  - "!**/templates/**"

overrides:
  "@isaacs/brace-expansion": "5.0.1"
  "body-parser": ">=2.4.0"
  "braces": ">=3.0.3"
  "browserify-sign@<4.2.2": ">=4.2.6"
  "cross-spawn": ">=7.0.6"
  "express": ">=4.19.2"
  "follow-redirects@<1.15.4": ">=1.16.1"
  "pac-resolver": ">=7.0.1"
  "socks": ">=2.8.10"
  "ws": ">=8.22.0"
  "brace-expansion@^1": ">=1.1.20 <2"
  "brace-expansion@^2": ">=2.1.6 <3"
  "brace-expansion@^5": ">=5.0.11 <6"
  "js-yaml@^4": ">=4.3.2"
  "axios": ">=1.20.0 <2"
  "fast-uri": ">=4.1.4 <5"

allowBuilds:
  core-js: true
  esbuild: true
  msw: false
  unrs-resolver: true

# unrs-resolver falls back to this WebAssembly binding on a platform it ships no
# native binding for. Nothing we build on is such a platform, and keeping it makes
# `pnpm licenses list` fail: the binding is the only path to tslib, which no install
# ever fetches, so the command stops on its missing index file in the store.
ignoredOptionalDependencies:
  - "@unrs/resolver-binding-wasm32-wasi"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Renovate security update: lodash@4.17.23 || 4.18.1
  - lodash@4.17.23 || 4.18.1
  # Renovate security update: webpack@5.104.1
  - webpack@5.104.1
  # Renovate security update: qs@6.14.2 || 6.16.0 || 6.16.1
  - qs@6.14.2 || 6.16.0 || 6.16.1
  # Renovate security update: yauzl@3.2.1
  - yauzl@3.2.1
  # Renovate security update: form-data@4.0.6
  - form-data@4.0.6
  # Renovate security update: adm-zip@0.6.1
  - adm-zip@0.6.1
  # Renovate security update: follow-redirects@1.16.1
  - follow-redirects@1.16.1
  # Renovate security update: toml@5.0.1
  - toml@5.0.1
  # Renovate security update: undici@7.30.1
  - undici@7.30.1
  # Renovate security update: body-parser@2.4.0
  - body-parser@2.4.0
